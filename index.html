<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Culture Click — an interactive living atlas of India's states, districts and heritage places." />
    <meta name="theme-color" content="#F4EFE6" />

    <!--
      Apply the saved theme before first paint. Without this the page rendered with the
      light palette and then flipped to dark once React mounted, which read as a flash.
      Kept inline and tiny on purpose — it must run before the stylesheet paints.
    -->
    <script>
      (function () {
        try {
          var dark = localStorage.getItem('cc-theme') === 'dark';
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#12181F';
          }
        } catch (e) {
          /* storage blocked — fall back to the light default */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://upload.wikimedia.org" />
    <title>Culture Click — Journey Through India</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
